services:
  mysql:
    image: mysql:8.0
    container_name: petzone-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-multipos_db}
      MYSQL_USER: ${DB_USER:-petzone}
      MYSQL_PASSWORD: ${DB_PASSWORD:-petzone_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${DB_PORT_FORWARD:-3307}:3306"
    volumes:
      - petzone_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
    container_name: petzone-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-multipos_db}
      DB_USER: ${DB_USER:-petzone}
      DB_PASSWORD: ${DB_PASSWORD:-petzone_dev_password}
      JWT_SECRET: ${JWT_SECRET:-local_only_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_refresh_only_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      INVENTORY_ALLOW_NEGATIVE_STOCK: ${INVENTORY_ALLOW_NEGATIVE_STOCK:-false}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  petzone_mysql_data:
